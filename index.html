<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>桜日和 · 水岸小屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: full-bleed miniature diorama; brand column on the left in wide screens, compact dock at the bottom. */
:root{
  --bg:#f3f2ec;
  --ink:#4b5058;
  --ink-soft:rgba(75,80,88,.62);
  --panel:rgba(255,253,248,.52);
  --panel-line:rgba(90,80,80,.16);
  --chip-on:rgba(200,96,118,.16);
  --accent:#c4637a;
  --f-display:"Shippori Mincho","Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Serif SC","Songti SC","SimSun",serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
#bg,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#bg{z-index:0}
#gl{z-index:1;touch-action:none;outline:none}
#grain,#vignette{position:fixed;inset:0;pointer-events:none}
#grain{z-index:2;opacity:.085;mix-blend-mode:multiply;background-size:220px 220px}
#vignette{z-index:2;background:radial-gradient(120% 95% at 56% 52%,rgba(0,0,0,0) 58%,rgba(46,34,48,.17) 100%)}
.ui{position:fixed;z-index:3;transition:opacity .5s ease}
body.pure .ui{opacity:0;pointer-events:none}

.brand{left:max(40px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-52%);display:flex;flex-direction:row-reverse;gap:22px;align-items:flex-start;pointer-events:none}
.logo{writing-mode:vertical-rl;display:flex;align-items:center;gap:12px}
.logo h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.32em;color:var(--ink)}
.seal{writing-mode:horizontal-tb;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;background:var(--accent);color:#fff8f4;font-family:var(--f-display);font-size:14px;font-weight:700;opacity:.88}
.poem{margin:52px 0 0;writing-mode:vertical-rl;font-size:16px;line-height:2.1;letter-spacing:.42em;color:var(--ink-soft);display:flex;gap:4px}
.poem span:last-child{margin-top:2.2em}
.sub{margin:0;writing-mode:vertical-rl;font-size:11px;letter-spacing:.3em;color:var(--ink-soft);opacity:.75;margin-top:120px}

.dock{left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:var(--panel);border:1px solid var(--panel-line);backdrop-filter:blur(10px) saturate(1.1);-webkit-backdrop-filter:blur(10px) saturate(1.1);box-shadow:0 6px 24px rgba(60,40,50,.06);max-width:calc(100vw - 32px);box-sizing:border-box}
.dock button{font:inherit;border:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:999px;padding:7px 13px;font-size:13px;letter-spacing:.08em;display:flex;align-items:baseline;gap:6px;white-space:nowrap;transition:background .3s}
.dock button small{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums;letter-spacing:0}
.dock button.on{background:var(--chip-on)}
.dock button:hover{background:var(--panel-line)}
.dock button:focus-visible,#exit:focus-visible,#time:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:flex;gap:2px;padding-right:6px;margin-right:2px;border-right:1px solid var(--panel-line)}
.seg button{padding:7px 10px;font-family:var(--f-display);font-size:14px}
.sw{display:inline-block;width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1px var(--panel-line);background:linear-gradient(135deg,var(--roof,#a7774c) 50%,var(--wall,#f6eee0) 50%)}
#palBtn{padding:7px 9px!important}
.pal{left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:6px;border-radius:16px;background:var(--panel);border:1px solid var(--panel-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:4;max-width:calc(100vw - 32px);box-sizing:border-box}
.pal button{font:inherit;font-size:12px;letter-spacing:.06em;color:var(--ink);background:transparent;border:0;border-radius:12px;padding:6px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:54px}
.pal button .sw{width:26px;height:26px}
.pal button.on{background:var(--chip-on)}
.pal button:hover{background:var(--panel-line)}
.pal button:focus-visible,#palBtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sl{display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;border-left:1px solid var(--panel-line);margin-left:2px}
#time{-webkit-appearance:none;appearance:none;width:150px;height:18px;background:transparent;cursor:pointer}
#time::-webkit-slider-runnable-track{height:2px;border-radius:2px;background:linear-gradient(90deg,#cfe0e2,#f4dccb 55%,#e8b28e 66%,#6d7598 78%,#2b3756)}
#time::-moz-range-track{height:2px;border-radius:2px;background:linear-gradient(90deg,#cfe0e2,#f4dccb 55%,#e8b28e 66%,#6d7598 78%,#2b3756)}
#time::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:#fffaf5;border:1.5px solid var(--accent)}
#time::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#fffaf5;border:1.5px solid var(--accent)}
#clock{font-size:12px;font-variant-numeric:tabular-nums;min-width:38px;color:var(--ink-soft)}
#pure{padding:7px 9px!important}
#pure svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.4}
.hint{left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));margin:0;font-size:11px;letter-spacing:.18em;color:var(--ink-soft);white-space:nowrap;pointer-events:none}
#exit{position:fixed;z-index:4;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-line);background:var(--panel);color:var(--ink);cursor:pointer;opacity:.55;transition:opacity .3s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#exit:hover{opacity:1}
#exit svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
#loading{position:fixed;inset:0;z-index:5;display:grid;place-items:center;font-family:var(--f-display);letter-spacing:.5em;color:var(--ink-soft);background:var(--bg);transition:opacity .8s}
#loading.done{opacity:0;pointer-events:none}

@media (max-width:760px),(max-aspect-ratio:4/5){
  .brand{left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);flex-direction:column;align-items:center;gap:6px}
  .logo{writing-mode:horizontal-tb;gap:8px}
  .logo h1{font-size:20px;letter-spacing:.3em}
  .poem{writing-mode:horizontal-tb;margin:0;font-size:12px;line-height:1.6;letter-spacing:.24em;gap:0}
  .poem span:last-child{margin-top:0}
  .sub{display:none}
  .dock{flex-wrap:wrap;justify-content:center;border-radius:20px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .dock button{padding:6px 10px;font-size:12px}
  .sl{border-left:0;margin:0;width:100%;justify-content:center;padding:0 6px 2px}
  .seg{width:100%;justify-content:center;border-right:0;border-bottom:1px solid var(--panel-line);padding:0 0 4px;margin:0 0 2px}
  .seg button{padding:5px 14px}
  #time{width:min(70vw,260px)}
  .hint{display:none}
  .pal{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){.ui,#loading{transition:none}}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="gl" tabindex="0" aria-label="樱花水岸小屋三维场景，可拖拽旋转、滚轮缩放"></canvas>
<div id="grain"></div>
<div id="vignette"></div>
<div id="loading">桜日和</div>

<p class="ui hint">拖拽旋转 · 滚轮缩放 · 点击障子门、风铃或水面</p>
<nav class="ui dock" aria-label="时间与模式">
  <div class="seg" role="group" aria-label="季节">
    <button type="button" data-s="spring" class="on" aria-label="春">春</button>
    <button type="button" data-s="summer" aria-label="夏">夏</button>
    <button type="button" data-s="autumn" aria-label="秋">秋</button>
    <button type="button" data-s="winter" aria-label="冬">冬</button>
  </div>
  <button type="button" id="b7" data-t="7">清晨<small>07:00</small></button>
  <button type="button" id="b18" data-t="18">黄昏<small>18:00</small></button>
  <button type="button" id="b22" data-t="22">夜晚<small>22:00</small></button>
  <div class="sl"><input type="range" id="time" min="6" max="24" step="0.01" value="7" aria-label="时间"><output id="clock" for="time">07:00</output>
  <button type="button" id="palBtn" title="小屋配色" aria-label="小屋配色" aria-expanded="false" aria-controls="pal"><span class="sw" id="palCur"></span></button>
  <button type="button" id="pure" title="纯享模式（H）" aria-label="纯享模式"><svg viewBox="0 0 16 16"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button></div>
</nav>
<div class="ui pal" id="pal" hidden role="group" aria-label="屋顶与墙壁配色"></div>
<button type="button" id="exit" hidden title="退出纯享模式" aria-label="退出纯享模式"><svg viewBox="0 0 14 14"><path d="M3 3l8 8M11 3l-8 8"/></svg></button>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ---------- utilities ---------- */
let seed = 20261030;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + rnd() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const UP = new THREE.Vector3(0, 1, 0);
const dummy = new THREE.Object3D(), mtx = new THREE.Matrix4(), tc = new THREE.Color();
const C = h => new THREE.Color(h);
function hash2(x, y){ const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y){ const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy; fx = fx*fx*(3-2*fx); fy = fy*fy*(3-2*fy);
  const a = hash2(ix, iy), b = hash2(ix+1, iy), c = hash2(ix, iy+1), d = hash2(ix+1, iy+1);
  return lerp(lerp(a, b, fx), lerp(c, d, fx), fy); }
const fbm = (x, y) => vnoise(x, y) * 0.6 + vnoise(x * 2.3 + 5, y * 2.3 + 1) * 0.3 + vnoise(x * 5.1, y * 5.1) * 0.1;

const narrow = () => innerWidth <= 760 || innerWidth / innerHeight < 0.8;
const isMobile = narrow() || /Mobi|Android/i.test(navigator.userAgent);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function cvs(w, h, draw, srgb = true, fill = null){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  if (fill){
    // cut-out textures: give transparent texels the foliage colour so filtering never pulls in black fringes
    const d = c.getContext('2d').getImageData(0, 0, w, h).data, out = new Uint8Array(d.length);
    for (let i = 0; i < d.length; i += 4){
      const a = d[i + 3];
      if (a > 200){ out[i] = d[i]; out[i + 1] = d[i + 1]; out[i + 2] = d[i + 2]; }
      else { const k = a / 200; out[i] = d[i] * k + fill[0] * (1 - k); out[i + 1] = d[i + 1] * k + fill[1] * (1 - k); out[i + 2] = d[i + 2] * k + fill[2] * (1 - k); }
      out[i + 3] = a;
    }
    const t = new THREE.DataTexture(out, w, h, THREE.RGBAFormat);
    t.flipY = true; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
    t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; t.needsUpdate = true;
    return t;
  }
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 1, 400);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.7;
controls.minPolarAngle = THREE.MathUtils.degToRad(15);
controls.maxPolarAngle = THREE.MathUtils.degToRad(75);
controls.target.set(0, 1.4, 0.4);

/* ---------- toon ramp & materials ---------- */
const RAMP = (() => {
  const w = 128, data = new Uint8Array(w * 4);
  for (let i = 0; i < w; i++){
    const x = i / (w - 1);
    const v = sstep(0.42, 0.50, x) * 0.62 + sstep(0.60, 0.70, x) * 0.24 + sstep(0.80, 0.92, x) * 0.14;
    const c = Math.round(v * 255); data.set([c, c, c, 255], i * 4);
  }
  const t = new THREE.DataTexture(data, w, 1, THREE.RGBAFormat);
  t.minFilter = t.magFilter = THREE.LinearFilter; t.needsUpdate = true; return t;
})();
const SNOW = { value: 0 };
function patchToon(m, strength, snow, power = 28){
  m.onBeforeCompile = sh => {
    if (snow){
      sh.uniforms.uSnow = SNOW;
      sh.fragmentShader = 'uniform float uSnow;\n' + sh.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      {
        vec3 upV = normalize((viewMatrix * vec4(0.0, 1.0, 0.0, 0.0)).xyz);
        float sn = smoothstep(0.42, 0.78, dot(normalize(vNormal), upV)) * uSnow;
        diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.93, 0.95, 0.98), sn);
      }`);
    }
    if (strength) sh.fragmentShader = sh.fragmentShader.replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
    #if NUM_DIR_LIGHTS > 0
    {
      vec3 Ls = directionalLights[0].direction;
      vec3 Hs = normalize(Ls + normalize(vViewPosition));
      float sp = smoothstep(0.55, 0.9, pow(max(dot(normal, Hs), 0.0), ${power.toFixed(1)}));
      float shd = 1.0;
      #if defined( USE_SHADOWMAP ) && NUM_DIR_LIGHT_SHADOWS > 0
        shd = getShadow(directionalShadowMap[0], directionalLightShadows[0].shadowMapSize, directionalLightShadows[0].shadowBias, directionalLightShadows[0].shadowRadius, vDirectionalShadowCoord[0]);
      #endif
      reflectedLight.directSpecular += directionalLights[0].color * sp * shd * ${(strength || 0).toFixed(3)};
    }
    #endif`);
  };
  m.customProgramCacheKey = () => 'p' + strength + '_' + snow;
  return m;
}
function toon(color, o = {}){
  const { spec, snow, ...rest } = o;
  const m = new THREE.MeshToonMaterial({ color, gradientMap: RAMP, ...rest });
  if (spec || snow) patchToon(m, spec || 0, !!snow);
  return m;
}

/* ---------- procedural textures ---------- */
function woodDraw(base, dark, lines = 70){
  return (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    for (let i = 0; i < lines; i++){
      const x = rnd() * w;
      g.strokeStyle = `rgba(${dark},${(0.06 + rnd() * 0.2).toFixed(3)})`;
      g.lineWidth = 0.6 + rnd() * 2.4; g.beginPath();
      for (let y = 0; y <= h; y += 6){
        const xx = x + Math.sin(y * 0.025 + i) * 4 * rnd() + Math.sin(y * 0.09 + i * 2) * 1.3;
        y === 0 ? g.moveTo(xx, y) : g.lineTo(xx, y);
      }
      g.stroke();
    }
    for (let k = 0; k < 2; k++){
      const cx = rnd() * w, cy = rnd() * h;
      for (let r = 2; r < 12; r += 3){ g.strokeStyle = `rgba(${dark},.18)`; g.lineWidth = 1; g.beginPath(); g.ellipse(cx, cy, r * 0.5, r * 1.6, 0, 0, 6.3); g.stroke(); }
    }
  };
}
const woodTexV = cvs(256, 256, woodDraw('#e2c09a', '120,78,48'));
woodTexV.wrapS = woodTexV.wrapT = THREE.RepeatWrapping;
const woodTexH = woodTexV.clone(); woodTexH.center.set(0.5, 0.5); woodTexH.rotation = Math.PI / 2; woodTexH.needsUpdate = true;
const plasterTex = cvs(256, 256, (g, w, h) => {
  g.fillStyle = '#f6f1e6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++){ const v = 200 + rnd() * 50 | 0; g.fillStyle = `rgba(${v},${v - 6},${v - 16},.10)`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 2, 1 + rnd() * 2); }
});
plasterTex.wrapS = plasterTex.wrapT = THREE.RepeatWrapping;
const paperTex = cvs(128, 128, (g, w, h) => {
  g.fillStyle = '#fbf7ee'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 220; i++){ g.strokeStyle = `rgba(190,175,150,${(0.05 + rnd() * 0.08).toFixed(3)})`; g.lineWidth = 0.6; g.beginPath(); const x = rnd() * w, y = rnd() * h, a = rnd() * 6.3, l = 4 + rnd() * 10; g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * .5 + 2, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
});
const barkTex = cvs(128, 256, (g, w, h) => {
  g.fillStyle = '#8a7068'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 160; i++){ const y = rnd() * h, x = rnd() * w, l = 6 + rnd() * 22; g.fillStyle = `rgba(${rnd() < .5 ? '70,52,50' : '170,150,140'},${(0.15 + rnd() * 0.25).toFixed(2)})`; g.fillRect(x, y, l, 1 + rnd() * 1.6); }
  for (let i = 0; i < 40; i++){ g.strokeStyle = 'rgba(60,45,45,.12)'; g.beginPath(); const x = rnd() * w; g.moveTo(x, 0); g.lineTo(x + R(-6, 6), h); g.stroke(); }
});
barkTex.wrapS = barkTex.wrapT = THREE.RepeatWrapping; barkTex.repeat.set(2, 3);

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xdde9f0, 0xb7bf9f, 1.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d4, 2.3);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
const sc = sun.shadow.camera; sc.left = -15; sc.right = 15; sc.top = 15; sc.bottom = -15; sc.near = 1; sc.far = 90;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03; sun.shadow.radius = 3;
scene.add(sun); scene.add(sun.target);
const interiorLight = new THREE.PointLight(0xffc98a, 0, 9, 1.3);
interiorLight.position.set(-0.6, 2.2, -2.0); scene.add(interiorLight);
const lampA = new THREE.PointLight(0xffc27a, 0, 7, 1.6); scene.add(lampA);
const lampB = new THREE.PointLight(0xffc27a, 0, 7, 1.6); scene.add(lampB);
const upLight = new THREE.SpotLight(0xffd2a0, 0, 12, 0.8, 0.7, 1.2); scene.add(upLight); scene.add(upLight.target);

/* shared uniforms for custom shaders */
const U = {
  uTime: { value: 0 },
  uSunDir: { value: new THREE.Vector3(0.5, 0.7, 0.4).normalize() },
  uSunCol: { value: new THREE.Color(1, 1, 1) },
  uSky: { value: new THREE.Color(0.5, 0.5, 0.5) },
  uGnd: { value: new THREE.Color(0.4, 0.4, 0.4) },
  uTint: { value: new THREE.Color(0.85, 0.82, 0.95) },
  uUpPos: { value: new THREE.Vector3() },
  uUpCol: { value: new THREE.Color(1, 0.8, 0.6) },
  uUpI: { value: 0 },
};

/* ---------- terrain ---------- */
const HALF = 10, WL = -0.26, BASE_BOTTOM = -1.6;
const streamZ = x => 4.9 + 1.1 * Math.sin(x * 0.33 + 0.4) + 0.45 * Math.sin(x * 0.81 + 2.0);
const streamW = x => 1.25 + 0.38 * Math.sin(x * 0.52 + 1.1) + 0.18 * Math.sin(x * 1.3);
function bankS(x, z){ const d = Math.abs(z - streamZ(x)), w = streamW(x); return sstep(w * 0.45, w * 1.12, d); }
function height(x, z){

    geos.push(g.toNonIndexed());

timeBtns.forEach(b => b.addEventListener('click', () => { tState.from = tState.t; tState.to = +b.dataset.t; tState.start = performance.now(); tState.dur = reduceMotion ? 1 : 1400; }));
slider.addEventListener('input', () => { tState.t = tState.to = +slider.value; tState.dur = 0; applyTime(tState.t); });

/* cottage colour schemes (roof + wall), the four Jacey picked */
const SCHEMES = [
  { id: 'B', name: '焦糖', roof: '#a7774c', wall: '#f6eee0' },
  { id: 'C', name: '咖啡', roof: '#4a3730', wall: '#ead6b8' },
  { id: 'D', name: '赤陶', roof: '#9c5638', wall: '#f3e8d6' },
  { id: 'E', name: '茶灰', roof: '#6b6560', wall: '#dcd0bf' },
];
const tileInst = house.children.filter(o => o.isInstancedMesh && o.material !== M.tileDark);
const palEl = document.getElementById('pal'), palBtn = document.getElementById('palBtn');
function applyScheme(id){
  const S = SCHEMES.find(x => x.id === id) || SCHEMES[0];
  const c = C(S.roof);
  M.tile.color.copy(c); M.tileDark.color.copy(c).multiplyScalar(0.8); M.tileLight.color.copy(c).multiplyScalar(1.12);
  tileInst.forEach(o => o.material.color.copy(c).multiplyScalar(1.06));
  M.plaster.color.set(S.wall); wallMats.forEach(m => m.color.set(S.wall));
  const cur = document.getElementById('palCur'); cur.style.setProperty('--roof', S.roof); cur.style.setProperty('--wall', S.wall);
  palEl.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.id === S.id); b.setAttribute('aria-pressed', b.dataset.id === S.id); });
  try { localStorage.setItem('sakura-scheme', S.id); } catch (e) {}
}
for (const S of SCHEMES){
  const b = document.createElement('button'); b.type = 'button'; b.dataset.id = S.id; b.setAttribute('aria-label', S.name);
  b.innerHTML = `<span class="sw" style="--roof:${S.roof};--wall:${S.wall}"></span>${S.name}`;
  b.addEventListener('click', () => applyScheme(S.id));
  palEl.appendChild(b);
}
palBtn.addEventListener('click', () => { palEl.hidden = !palEl.hidden; palBtn.setAttribute('aria-expanded', !palEl.hidden); });
canvas.addEventListener('pointerdown', () => { if (!palEl.hidden){ palEl.hidden = true; palBtn.setAttribute('aria-expanded', false); } });
let savedScheme = 'B'; try { savedScheme = localStorage.getItem('sakura-scheme') || 'B'; } catch (e) {}
applyScheme(savedScheme);

/* pure mode */
const exitBtn = document.getElementById('exit');
function setPure(on){ document.body.classList.toggle('pure', on); exitBtn.hidden = !on; }
document.getElementById('pure').addEventListener('click', () => setPure(true));
exitBtn.addEventListener('click', () => setPure(false));
addEventListener('keydown', e => { if (e.key === 'h' || e.key === 'H') setPure(!document.body.classList.contains('pure')); if (e.key === 'Escape') setPure(false); });

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downPos = null, ripIdx = 0;
const hitList = [...clickable, water, scene.getObjectByName('ground')];
function pick(e){
  const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(hitList, false);
  for (const h of hits){ if (h.object === water){ if (height(h.point.x, h.point.z) < WL) return { kind: 'water', point: h.point }; continue; } return { kind: h.object.userData.kind, point: h.point }; }
  return null;
}
canvas.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 6) return;
  const h = pick(e); if (!h) return;
  if (h.kind === 'shoji'){ door.target = door.s > 0.05 && door.target > 0.05 ? 0 : 1; }
  else if (h.kind === 'furin'){ chime.amp = 0.45; }
  else if (h.kind === 'water'){
    waterU.uRip.value[ripIdx].set(h.point.x, h.point.z, clock.elapsedTime, 1); ripIdx = (ripIdx + 1) % 6;
    for (const k of koi) if (k.g.position.distanceTo(h.point) < 3) k.boost = 1;
  }
});
canvas.addEventListener('pointermove', e => {
  if (e.buttons) return;
  const h = pick(e); canvas.style.cursor = h && (h.kind === 'shoji' || h.kind === 'furin' || h.kind === 'water') ? 'pointer' : 'grab';
});

/* ---------- camera framing ---------- */
const baseAz = THREE.MathUtils.degToRad(35), baseEl = THREE.MathUtils.degToRad(31);
let fitDist = 44;
function frame(initial){
  const w = innerWidth, h = innerHeight, a = w / h;
  renderer.setSize(w, h); camera.aspect = a;
  camera.fov = a < 0.9 ? 38 : 30;
  const vt = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  fitDist = Math.max(17.5 / vt, (a < 0.9 ? 15.0 : 16.2) / (vt * a));
  if (a > 1.25) camera.setViewOffset(w, h, 0, h * 0.015, w, h); else if (a < 0.9) camera.setViewOffset(w, h, 0, h * 0.02, w, h); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  controls.minDistance = fitDist * 0.32; controls.maxDistance = fitDist * 1.5;
  if (initial){ camera.position.set(Math.sin(baseAz) * Math.cos(baseEl), Math.sin(baseEl), Math.cos(baseAz) * Math.cos(baseEl)).multiplyScalar(fitDist).add(controls.target); }
  bgDirty = palette(tState.t);
}
frame(true);
addEventListener('resize', () => frame(false));

/* ---------- animation ---------- */
const clock = new THREE.Clock();
applyTime(tState.t);
const q = new THREE.Quaternion(), eul = new THREE.Euler(), sv = new THREE.Vector3(), pv = new THREE.Vector3();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05), T = clock.elapsedTime;
  U.uTime.value = T;
  stepSeason(dt);
  if (tState.dur && tState.t !== tState.to){
    const k = clamp((performance.now() - tState.start) / tState.dur, 0, 1);
    tState.t = lerp(tState.from, tState.to, k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
    if (k >= 1){ tState.t = tState.to; tState.dur = 0; }
    slider.value = tState.t; applyTime(tState.t);
  }
  if (bgDirty){ drawBG(bgDirty); bgDirty = null; }
  // shoji
  door.s += (door.target - door.s) * Math.min(1, dt * 5);
  for (const p of shoji) p.g.position.x = p.x0 + p.dir * door.s;
  // wind chime
  chime.amp = Math.max(0.05, chime.amp * Math.pow(0.55, dt));
  furin.rotation.z = Math.sin(T * 2.3) * chime.amp * 0.5 + Math.sin(T * 1.1) * 0.03;
  furin.rotation.x = Math.sin(T * 1.7 + 1) * chime.amp * 0.3;
  furin.userData.tong.rotation.z = Math.sin(T * 3.4 + 0.5) * chime.amp * 1.2;
  furin.userData.tong.rotation.x = Math.sin(T * 2.9) * chime.amp * 0.8;
  // ribbons
  for (const r of ribbons){
    const a = r.m.geometry.attributes.position, b = r.base;
    for (let i = 0; i < a.count; i++){ const y = b[i * 3 + 1]; const f = Math.pow(Math.max(0, -y / r.len), 1.3); a.setX(i, b[i * 3] + Math.sin(T * 1.9 + y * 3 + r.ph) * 0.12 * f); a.setZ(i, Math.cos(T * 1.4 + y * 2.5 + r.ph) * 0.09 * f); }
    a.needsUpdate = true;
  }
  for (const t of tags){ t.piv.rotation.z = Math.sin(T * 1.6 + t.ph) * 0.18; t.piv.rotation.x = Math.sin(T * 1.2 + t.ph * 2) * 0.12; }
  // falling petals
  for (let i = 0; i < fallMesh.count; i++){
    const p = falls[i];
    p.y -= p.vy * dt; p.x += (p.drift + Math.sin(T * 0.7 + p.ph) * 0.25) * dt; p.z += Math.cos(T * 0.9 + p.ph) * 0.15 * dt;
    p.rx += p.spin * dt; p.ry += p.spin * 0.7 * dt;
    if (p.y < Math.max(height(p.x, p.z), WL) + 0.02 || Math.abs(p.x) > 10.5) spawnFall(p, false);
    eul.set(p.rx, p.ry, Math.sin(T + p.ph)); q.setFromEuler(eul); const fs = SEASONS[season.cur].scale; mtx.compose(pv.set(p.x, p.y, p.z), q, sv.set(fs, fs, fs)); fallMesh.setMatrixAt(i, mtx);
  }
  fallMesh.instanceMatrix.needsUpdate = true;
  // floating petals drift downstream
  for (let i = 0; i < floatMesh.count; i++){
    const f = floats[i];
    f.x += f.sp * dt; if (f.x > 9.85) f.x = -9.85;
    const z = streamZ(f.x) + f.off * streamW(f.x) * 0.8 + Math.sin(T * 0.6 + f.ph) * 0.05;
    f.rz += dt * 0.3 * Math.sin(f.ph + T * 0.2);
    eul.set(-Math.PI / 2, 0, f.rz); q.setFromEuler(eul);
    mtx.compose(pv.set(f.x, WL + 0.012 + Math.sin(T * 1.6 + f.ph) * 0.004, z), q, sv.set(1, 1, 1)); floatMesh.setMatrixAt(i, mtx);
  }
  floatMesh.instanceMatrix.needsUpdate = true;
  // koi
  for (const k of koi){
    k.boost = Math.max(0, k.boost - dt * 0.4);
    k.ph += dt * k.sp * (1 + k.boost * 2.2);
    const x = Math.sin(k.ph) * k.amp, dx = Math.cos(k.ph);
    const z = streamZ(x) + k.lane * streamW(x) * (0.6 + 0.2 * Math.sin(k.ph * 3));
    const x2 = Math.sin(k.ph + 0.01 * Math.sign(dx)) * k.amp, z2 = streamZ(x2) + k.lane * streamW(x2) * (0.6 + 0.2 * Math.sin((k.ph + 0.01) * 3));
    k.g.position.set(x, k.y + Math.sin(T * 0.8 + k.ph) * 0.015, z);
    k.g.rotation.y = -Math.atan2(z2 - z, x2 - x) + Math.sin(T * 6 + k.ph * 10) * 0.06;
    k.tail.rotation.y = Math.sin(T * (7 + k.boost * 8) + k.ph * 20) * 0.45;
  }
  // tea steam
  for (const s of steam){
    s.t += dt * 0.28; if (s.t > 1) s.t -= 1;
    const t = s.t;
    s.sp.position.set(s.src.x + Math.sin(T * 1.3 + t * 6 + s.src.x) * 0.03 * t, s.src.y + 0.02 + t * 0.32, s.src.z + Math.cos(T + t * 5) * 0.02 * t);
    s.sp.scale.setScalar(0.05 + t * 0.12);
    s.sp.material.opacity = Math.sin(t * Math.PI) * 0.22;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
document.getElementById('loading').classList.add('done');
window.__ready = true;
window.__debug = { treeInfo, RY, camera, controls, setSeason: n => { setSeason(n); stepSeason(10); },
  scheme: id => applyScheme(id), setTime: t => { tState.t = tState.to = t; tState.dur = 0; slider.value = t; applyTime(t); } };
</script>

</body>
